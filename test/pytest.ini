[pytest]
# Configuración de pytest para UE Los Andes Testing
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opciones de salida
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    -ra

# Markers personalizados
markers =
    smoke: Pruebas de humo (smoke tests)
    integration: Pruebas de integración
    security: Pruebas de seguridad
    e2e: Pruebas end-to-end
    unit: Pruebas unitarias (caja blanca)

# Timeout (en segundos)
timeout = 300

# Cobertura
[coverage:run]
source = .
omit = 
    */tests/*
    */test_*.py
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
