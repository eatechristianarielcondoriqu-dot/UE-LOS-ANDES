{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - UE Los Andes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div class="login-container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left me-2"></i> Volver al Inicio</a>

        <div class="login-card">
            <div class="login-header">
                <div class="login-icon-wrapper">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h2>Iniciar Sesión</h2>
                <p class="text-muted small">Portal de Acceso Educativo Integrado</p>
            </div>

            {% if error %}
                <div class="alert-error">
                    <i class="fas fa-exclamation-circle me-2"></i> {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/login/">
                {% csrf_token %}
                
                <div class="form-group mb-3">
                    <label class="form-label text-navy fw-semibold">Nombre de Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fas fa-user"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Ej. mrodriguez" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label class="form-label text-navy fw-semibold">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="fas fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="g-recaptcha-wrapper d-flex justify-content-center mb-4">
                    <div class="g-recaptcha" data-sitekey="6LfQoeUsAAAAAFELKoSZ9ZCqoqoOna8QgiV6isXo"></div>
                </div>

                <button type="submit" class="btn-login-submit">Autenticar Ingreso</button>
            </form>
        </div>
    </div>

</body>
</html>
